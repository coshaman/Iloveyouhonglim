<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>강의실 시뮬레이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #121212;
      color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      padding: 24px;
      border-radius: 18px;
      background: radial-gradient(circle at top, #2b3138 0, #181a20 50%, #111 100%);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
      display: grid;
      grid-template-columns: minmax(270px, 320px) 1fr;
      gap: 20px;
    }

    @media (max-width: 840px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      padding: 18px 18px 14px;
      border-radius: 14px;
      background: rgba(10, 12, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel h1 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }

    .panel p {
      font-size: 0.85rem;
      opacity: 0.7;
      line-height: 1.4;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .control-group {
      margin-top: 8px;
      margin-bottom: 2px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    label {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    input[type="color"] {
      width: 44px;
      height: 26px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      cursor: pointer;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #ffcc66;
      cursor: pointer;
    }

    .layout-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .layout-btn {
      flex: 1;
      min-width: 80px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: #f9f9f9;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease,
        box-shadow 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .layout-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
    }

    .layout-btn.active {
      background: linear-gradient(135deg, #ffb347, #ffcc66);
      color: #202020;
      border-color: rgba(0, 0, 0, 0.2);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
    }

    .info-note {
      margin-top: 4px;
      font-size: 0.78rem;
      opacity: 0.7;
      line-height: 1.3;
    }

    .room-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #101217;
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px 8px;
      background: radial-gradient(circle at top left, #25303d 0, #14161b 45%, #101218 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .room-header-title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .room-header-sub {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .room-light-indicator {
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .room-light-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffd966;
      box-shadow: 0 0 8px rgba(255, 217, 102, 0.9);
    }

    .room-canvas {
      position: relative;
      height: 420px;
      padding: 10px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: filter 0.25s ease, background-color 0.25s ease;
    }

    .room-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.12) 0,
          rgba(17, 20, 28, 0.96) 38%, rgba(6, 8, 13, 1) 100%);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .wall-accent {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.08) 0,
          transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.06) 0,
          transparent 45%);
      mix-blend-mode: screen;
      opacity: 0.7;
    }

    .blackboard {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      height: 80px;
      border-radius: 10px;
      background: linear-gradient(135deg, #111c15, #060d09);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .blackboard::before {
      content: "CLASSROOM SIM";
      position: absolute;
      left: 18px;
      bottom: 14px;
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
    }

    .blackboard::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 40%;
      background-image: url("https://png.pngtree.com/png-vector/20220609/ourmid/pngtree-school-classroom-desks-and-chairs-png-image_4870679.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center right 6px;
      opacity: 0.55;
      filter: saturate(0.8);
    }

    .teacher-desk {
      position: absolute;
      top: 118px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 40px;
      border-radius: 9px;
      background: linear-gradient(145deg, #c28b5a, #8c5a2d);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55);
    }

    .teacher-desk::before {
      content: "";
      position: absolute;
      inset: 3px 4px 8px;
      border-radius: 7px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.02));
      mix-blend-mode: soft-light;
      opacity: 0.9;
    }

    .teacher-chair {
      position: absolute;
      top: 154px;
      left: 50%;
      transform: translateX(-50%);
      width: 46px;
      height: 26px;
      background: linear-gradient(145deg, #343b4a, #181c25);
      border-radius: 10px 10px 6px 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    }

    .teacher-chair::after {
      content: "";
      position: absolute;
      top: -18px;
      left: 50%;
      width: 40px;
      height: 18px;
      transform: translateX(-50%);
      border-radius: 10px 10px 4px 4px;
      background: linear-gradient(135deg, #505a6e, #222632);
    }

    .student-area {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 20px;
      top: 180px;
    }

    .desk {
      position: absolute;
      width: 80px;
      height: 52px;
      border-radius: 9px;
      background: linear-gradient(145deg, #c99863, #8a5b2f);
      box-shadow: 0 8px 17px rgba(0, 0, 0, 0.6);
      transition: transform 0.6s ease, left 0.6s ease, top 0.6s ease;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 3px;
    }

    .desk::before {
      content: "";
      position: absolute;
      inset: 3px 4px 16px;
      border-radius: 7px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.02));
      opacity: 0.9;
      pointer-events: none;
    }

    .desk .chair {
      position: relative;
      width: 60%;
      height: 20px;
      border-radius: 8px 8px 4px 4px;
      background: linear-gradient(145deg, #434a5b, #1f222c);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
    }

    .desk .chair::after {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 12px;
      border-radius: 8px 8px 4px 4px;
      background: linear-gradient(135deg, #606980, #22252f);
    }

    .desk label {
      position: absolute;
      top: 2px;
      right: 6px;
      font-size: 0.65rem;
      opacity: 0.7;
      color: #1d1207;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .room-floor {
      position: absolute;
      inset: auto 0 0 0;
      height: 28%;
      background-image: linear-gradient(135deg, #1d1f26 0, #171922 45%, #14151e 100%);
      box-shadow: inset 0 14px 25px rgba(0, 0, 0, 0.8);
    }

    .room-floor::before {
      content: "";
      position: absolute;
      inset: 8% 8% auto 8%;
      height: 3px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06));
      opacity: 0.9;
    }

    .room-floor::after {
      content: "";
      position: absolute;
      inset: 35% 8% 10% 8%;
      background-size: 22px 22px;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.5) 1px,
          transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.55) 1px,
          transparent 1px);
      opacity: 0.28;
    }

    .status-bar {
      margin-top: 4px;
      padding: 6px 10px 8px;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-layout {
      opacity: 0.78;
    }

    .status-hint {
      opacity: 0.7;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div>
        <h1>강의실 시뮬레이터</h1>
        <p>배경 색감과 조도를 조절하고, 책상/의자 배치를 바꾸면서
          강의실 분위기를 실험해 볼 수 있어.</p>
      </div>

      <div class="control-group">
        <div class="section-title">배경 색감</div>
        <div class="control-row">
          <label for="colorPicker">색상</label>
          <input type="color" id="colorPicker" value="#3a6ea5" />
        </div>
        <div class="info-note">
          벽 전체 톤을 바꾸는 느낌으로 생각하면 돼.
        </div>
      </div>

      <div class="control-group">
        <div class="section-title">조도 (밝기)</div>
        <div class="control-row">
          <label for="brightnessRange">어두움</label>
          <input type="range" id="brightnessRange" min="30" max="130" value="90" />
          <span style="font-size: 0.8rem; opacity: 0.8;">밝음</span>
        </div>
        <div class="info-note">
          조도가 높을수록 전체가 밝아지고, 낮을수록 집중도 높은
          어두운 강의실이 돼.
        </div>
      </div>

      <div class="control-group">
        <div class="section-title">책상/의자 배치</div>
        <div class="layout-buttons">
          <button class="layout-btn active" data-layout="rows">줄세우기</button>
          <button class="layout-btn" data-layout="groups">모둠형</button>
          <button class="layout-btn" data-layout="u-shape">U자 배치</button>
        </div>
        <div class="info-note">
          버튼을 누를 때마다 책상이 부드럽게 움직이면서 배치가
          바뀌어. 학생 수는 12명으로 가정했어.
        </div>
      </div>
    </div>

    <div class="room-wrapper">
      <div class="room-header">
        <div>
          <div class="room-header-title">가상 강의실</div>
          <div class="room-header-sub">배경/조도/배치 실험 공간</div>
        </div>
        <div class="room-light-indicator">
          <span class="room-light-dot" id="lightDot"></span>
          <span id="lightLabel">조도: 90%</span>
        </div>
      </div>
      <div class="room-canvas" id="roomCanvas">
        <div class="room-inner" id="roomInner">
          <div class="wall-accent"></div>
          <div class="blackboard"></div>
          <div class="teacher-desk"></div>
          <div class="teacher-chair"></div>
          <div class="student-area" id="studentArea"></div>
          <div class="room-floor"></div>
        </div>
      </div>
      <div class="status-bar">
        <div class="status-layout" id="layoutStatus">현재 배치: 줄세우기</div>
        <div class="status-hint">배치 버튼을 눌러 책상을 움직여 보세요.</div>
      </div>
    </div>
  </div>

  <script>
    const studentArea = document.getElementById("studentArea");
    const layoutButtons = document.querySelectorAll(".layout-btn");
    const layoutStatus = document.getElementById("layoutStatus");
    const colorPicker = document.getElementById("colorPicker");
    const brightnessRange = document.getElementById("brightnessRange");
    const roomCanvas = document.getElementById("roomCanvas");
    const roomInner = document.getElementById("roomInner");
    const lightLabel = document.getElementById("lightLabel");
    const lightDot = document.getElementById("lightDot");

    const deskCount = 12;
    const desks = [];

    for (let i = 0; i < deskCount; i++) {
      const desk = document.createElement("div");
      desk.className = "desk";
      const chair = document.createElement("div");
      chair.className = "chair";
      const label = document.createElement("label");
      label.textContent = i + 1;
      desk.appendChild(chair);
      desk.appendChild(label);
      studentArea.appendChild(desk);
      desks.push(desk);
    }

    function getLayoutPositions(layout) {
      const w = studentArea.clientWidth;
      const h = studentArea.clientHeight;

      const positions = [];

      if (layout === "rows") {
        const rows = 3;
        const cols = 4;
        const marginX = w * 0.04;
        const marginY = h * 0.08;
        const innerW = w - marginX * 2;
        const innerH = h - marginY * 2;
        const stepX = innerW / (cols - 1);
        const stepY = innerH / (rows - 1);

        let idx = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (idx >= deskCount) break;
            const x = marginX + c * stepX;
            const y = marginY + r * stepY;
            positions.push({ left: x, top: y });
            idx++;
          }
        }
      } else if (layout === "groups") {
        const groupCenters = [
          { x: w * 0.25, y: h * 0.3 },
          { x: w * 0.75, y: h * 0.3 },
          { x: w * 0.25, y: h * 0.75 },
          { x: w * 0.75, y: h * 0.75 },
        ];
        const offsets = [
          { x: -30, y: -24 },
          { x: 30, y: -24 },
          { x: -30, y: 24 },
          { x: 30, y: 24 },
        ];

        let idx = 0;
        for (let g = 0; g < groupCenters.length; g++) {
          for (let k = 0; k < offsets.length; k++) {
            if (idx >= deskCount) break;
            const cx = groupCenters[g].x;
            const cy = groupCenters[g].y;
            const off = offsets[k];
            positions.push({ left: cx + off.x, top: cy + off.y });
            idx++;
          }
        }
      } else if (layout === "u-shape") {
        const leftX = w * 0.1;
        const rightX = w * 0.9;
        const topY = h * 0.15;
        const bottomY = h * 0.85;

        const sideCount = 4;
        const vertStep = (bottomY - topY) / (sideCount - 1);

        let idx = 0;
        for (let i = 0; i < sideCount && idx < deskCount; i++) {
          const y = topY + i * vertStep;
          positions.push({ left: leftX, top: y });
          idx++;
        }
        for (let i = 0; i < sideCount && idx < deskCount; i++) {
          const y = topY + i * vertStep;
          positions.push({ left: rightX, top: y });
          idx++;
        }

        const bottomCount = Math.min(4, deskCount - positions.length);
        if (bottomCount > 0) {
          const stepX = (rightX - leftX) / (bottomCount + 1);
          for (let i = 1; i <= bottomCount && idx < deskCount; i++) {
            const x = leftX + stepX * i;
            positions.push({ left: x, top: bottomY });
            idx++;
          }
        }

        while (positions.length < deskCount) {
          positions.push({
            left: w * 0.5 + (positions.length - deskCount / 2) * 10,
            top: h * 0.5,
          });
        }
      }

      while (positions.length < deskCount) {
        positions.push({ left: w / 2, top: h / 2 });
      }

      return positions;
    }

    let currentLayout = "rows";

    function applyLayout(layout, animate = true) {
      currentLayout = layout;
      const positions = getLayoutPositions(layout);

      studentArea.classList.remove("no-animation");
      if (!animate) {
        studentArea.classList.add("no-animation");
      }

      desks.forEach((desk, i) => {
        const pos = positions[i];
        const deskWidth = desk.offsetWidth || 80;
        const deskHeight = desk.offsetHeight || 52;
        desk.style.left = `${pos.left - deskWidth / 2}px`;
        desk.style.top = `${pos.top - deskHeight / 2}px`;
      });

      layoutButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.layout === layout);
      });

      let layoutName = "줄세우기";
      if (layout === "groups") layoutName = "모둠형";
      if (layout === "u-shape") layoutName = "U자 배치";
      layoutStatus.textContent = `현재 배치: ${layoutName}`;
    }

    function updateBackgroundColor(color) {
      roomInner.style.background = `radial-gradient(circle at top, ${hexToRgba(
        color,
        0.4
      )} 0, rgba(5, 7, 12, 0.96) 40%, rgba(3, 5, 10, 1) 100%)`;
    }

    function updateBrightness(value) {
      const brightness = value / 100;
      roomCanvas.style.filter = `brightness(${brightness})`;
      lightLabel.textContent = `조도: ${value}%`;

      if (value < 50) {
        lightDot.style.background = "#ff9933";
        lightDot.style.boxShadow = "0 0 10px rgba(255,153,51,0.9)";
      } else if (value < 90) {
        lightDot.style.background = "#ffd966";
        lightDot.style.boxShadow = "0 0 10px rgba(255,217,102,0.95)";
      } else {
        lightDot.style.background = "#fff4b2";
        lightDot.style.boxShadow = "0 0 12px rgba(255,244,178,1)";
      }
    }

    function hexToRgba(hex, alpha) {
      let c = hex.replace("#", "");
      if (c.length === 3) {
        c = c
          .split("")
          .map((x) => x + x)
          .join("");
      }
      const r = parseInt(c.substring(0, 2), 16);
      const g = parseInt(c.substring(2, 4), 16);
      const b = parseInt(c.substring(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    layoutButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const layout = btn.dataset.layout;
        if (layout === currentLayout) return;
        applyLayout(layout, true);
      });
    });

    colorPicker.addEventListener("input", (e) => {
      updateBackgroundColor(e.target.value);
    });

    brightnessRange.addEventListener("input", (e) => {
      updateBrightness(e.target.value);
    });

    function init() {
      updateBackgroundColor(colorPicker.value);
      updateBrightness(brightnessRange.value);
      applyLayout("rows", false);

      window.addEventListener("resize", () => {
        applyLayout(currentLayout, false);
      });
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
